<title id="title">How data becomes a frame / 数据如何封装成一帧</title><desc id="desc">Each layer adds information: application data, TCP header, IP header and Ethernet framing. 各层逐步添加信息：应用数据、TCP 头部、IP 头部与以太网帧结构。</desc>
