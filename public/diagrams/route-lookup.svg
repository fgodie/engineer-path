<svg xmlns="http://www.w3.org/2000/svg" width="920" height="476" viewBox="0 0 920 476" role="img" aria-labelledby="title desc">
<title id="title">The most specific route wins / 转发时优先选择最具体的匹配路由</title><desc id="desc">Destination 10.20.30.42 matches a default route, /16 and /24; /24 wins by longest-prefix matching. 目标同时匹配默认路由、/16 和 /24，按最长前缀选择 /24。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087b5e"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<rect width="920" height="476" fill="#f5faf7" rx="16"/>
<text x="32" y="38" fill="#087b5e" font-size="13" text-anchor="start" font-weight="600">ENGINEER PATH  /  VISUAL GUIDE</text>
<text x="32" y="77" fill="#203e35" font-size="25" text-anchor="start" font-weight="600">The most specific route wins</text>
<text x="32" y="102" fill="#567367" font-size="16" text-anchor="start" font-weight="400">转发时优先选择最具体的匹配路由</text>
<rect x="32" y="135" width="290" height="90" rx="12" fill="#e6f3ea" stroke="#cbded4" stroke-width="1.5"/>
<text x="177.0" y="174.0" fill="#203e35" font-size="18" text-anchor="middle" font-weight="600">Destination / 目的地址</text>
<text x="177.0" y="199.0" fill="#567367" font-size="16" text-anchor="middle" font-weight="400">10.20.30.42</text>
<path d="M322 180 L375 180" fill="none" stroke="#087b5e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="400" y="148" fill="#203e35" font-size="16" text-anchor="start" font-weight="600">Prefix / 前缀</text>
<text x="610" y="148" fill="#203e35" font-size="16" text-anchor="start" font-weight="600">Next hop / 下一跳</text>
<text x="790" y="148" fill="#203e35" font-size="16" text-anchor="start" font-weight="600">Match / 匹配</text>
<rect x="382" y="167" width="506" height="54" rx="6" fill="#fff" stroke="#cbded4" stroke-width="1.5"/>
<text x="400" y="200" fill="#203e35" font-size="16" text-anchor="start" font-weight="400">0.0.0.0/0</text>
<text x="610" y="200" fill="#203e35" font-size="16" text-anchor="start" font-weight="400">192.0.2.1</text>
<text x="790" y="200" fill="#203e35" font-size="16" text-anchor="start" font-weight="400">Yes / 是</text>
<rect x="382" y="232" width="506" height="54" rx="6" fill="#fff" stroke="#cbded4" stroke-width="1.5"/>
<text x="400" y="265" fill="#203e35" font-size="16" text-anchor="start" font-weight="400">10.20.0.0/16</text>
<text x="610" y="265" fill="#203e35" font-size="16" text-anchor="start" font-weight="400">192.0.2.2</text>
<text x="790" y="265" fill="#203e35" font-size="16" text-anchor="start" font-weight="400">Yes / 是</text>
<rect x="382" y="297" width="506" height="54" rx="6" fill="#dff2e7" stroke="#087b5e" stroke-width="1.5"/>
<text x="400" y="330" fill="#087b5e" font-size="16" text-anchor="start" font-weight="600">10.20.30.0/24</text>
<text x="610" y="330" fill="#087b5e" font-size="16" text-anchor="start" font-weight="600">192.0.2.3</text>
<text x="790" y="330" fill="#087b5e" font-size="16" text-anchor="start" font-weight="600">BEST / 最优</text>
<rect x="32" y="365" width="856" height="70" rx="12" fill="#fff" stroke="#cbded4" stroke-width="1.5"/>
<text x="460.0" y="394.0" fill="#203e35" font-size="18" text-anchor="middle" font-weight="600">/24 is longer than /16 and /0</text>
<text x="460.0" y="419.0" fill="#567367" font-size="16" text-anchor="middle" font-weight="400">/24 比 /16 和 /0 更具体，因此本次查表选择下一跳 192.0.2.3。</text>
<text x="32" y="459" fill="#567367" font-size="14" text-anchor="start" font-weight="400">Forwarding lookup example; route-source preference is a separate decision. / 路由来源优选是另一项决策。</text>
</svg>